version: '3.8'

services:
  synapse-rag:
    build: .
    container_name: synapse-rag-app
    ports:
      - "8501:8501"   # Streamlit Web UI
      - "8080:8080"   # Security & Auth Gateway
      - "8000:8000"   # Core RAG Agentic Engine
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - LLM_PROVIDER=auto
      - JWT_SECRET=synapse_rag_super_secret_jwt_key_2026
    restart: unless-stopped
